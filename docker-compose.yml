name: giddyedu

services:
  postgres:
    image: postgres:18
    container_name: giddyedu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - giddyedu-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: giddyedu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - giddyedu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/src/Api/Dockerfile
    container_name: giddyedu-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: ${JWT__ISSUER}
      Jwt__Audience: ${JWT__AUDIENCE}
      Jwt__SigningKey: ${JWT__SIGNINGKEY}
      App__PublicBaseUrl: ${APP__PUBLICBASEURL:-http://localhost:3000}
      R2__Endpoint: ${R2__ENDPOINT}
      R2__Region: ${R2__REGION:-auto}
      R2__Bucket: ${R2__BUCKET}
      R2__AccessKey: ${R2__ACCESSKEY}
      R2__SecretKey: ${R2__SECRETKEY}
      SMTP__Host: ${SMTP_HOST}
      SMTP__Port: ${SMTP_PORT:-587}
      SMTP__Security: ${SMTP_SECURITY:-StartTls}
      SMTP__Authentication: ${SMTP_AUTH:-true}
      SMTP__Username: ${SMTP_USERNAME}
      SMTP__Password: ${SMTP_PASSWORD}
      SMTP__FromEmail: ${SMTP_FROM_EMAIL}
      SMTP__FromName: ${SMTP_FROM_NAME:-GiddyEdu}
      DataProtection__CertificatePath: ${DATAPROTECTION__CERTIFICATEPATH:-}
      DataProtection__CertificatePassword: ${DATAPROTECTION__CERTIFICATEPASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - giddyedu-data-protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/src/Worker/Dockerfile
    container_name: giddyedu-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      R2__Endpoint: ${R2__ENDPOINT}
      R2__Region: ${R2__REGION:-auto}
      R2__Bucket: ${R2__BUCKET}
      R2__AccessKey: ${R2__ACCESSKEY}
      R2__SecretKey: ${R2__SECRETKEY}
      SMTP__Host: ${SMTP_HOST}
      SMTP__Port: ${SMTP_PORT:-587}
      SMTP__Security: ${SMTP_SECURITY:-StartTls}
      SMTP__Authentication: ${SMTP_AUTH:-true}
      SMTP__Username: ${SMTP_USERNAME}
      SMTP__Password: ${SMTP_PASSWORD}
      SMTP__FromEmail: ${SMTP_FROM_EMAIL}
      SMTP__FromName: ${SMTP_FROM_NAME:-GiddyEdu}
      DataProtection__CertificatePath: ${DATAPROTECTION__CERTIFICATEPATH:-}
      DataProtection__CertificatePassword: ${DATAPROTECTION__CERTIFICATEPASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - giddyedu-data-protection:/home/app/.aspnet/DataProtection-Keys

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: giddyedu-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_INTERNAL_BASE_URL: http://api:8080
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  giddyedu-postgres-data:
  giddyedu-redis-data:
  giddyedu-data-protection:
