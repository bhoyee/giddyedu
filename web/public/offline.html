<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12372a" />
    <title>GiddyEdu — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #f6f4ee; color: #17201c; font-family: system-ui, sans-serif; }
      main { width: min(100%, 34rem); border-radius: 1.5rem; background: white; padding: 2rem; box-shadow: 0 1rem 3rem rgb(18 55 42 / 12%); }
      img { width: 4rem; height: 4rem; }
      h1 { margin: 1rem 0 .5rem; font-size: 2rem; }
      p { line-height: 1.6; color: #52615a; }
      button { margin-top: 1rem; border: 0; border-radius: .75rem; padding: .8rem 1.1rem; background: #12372a; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/giddyedu.svg" alt="" />
      <h1>You’re offline</h1>
      <p>GiddyEdu cannot reach the server. Check your connection and try again. Secure school and account information is not stored in this offline page.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
